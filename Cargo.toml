[workspace]
members = ["crates/*", "examples/*"]
exclude = ["crates/cargo-clawless/tests/commands/new.out"]

# Opt-in to the new feature resolver introduced in Rust 1.85 and Edition 2024.
# https://doc.rust-lang.org/cargo/reference/resolver.html#resolver-versions
resolver = "3"

[workspace.package]
version = "0.5.0"
edition = "2024"

license = "Apache-2.0 OR MIT"
repository = "https://github.com/aonyx-ai/clawless.git"

# darling 0.23 requires Rust 1.88.0 or greater
rust-version = "1.88.0"

[workspace.dependencies]
anyhow = "1.0.16"
assert_cmd = "2.1.1"
async-trait = "0.1"
bon = "3"
clap = { version = "4.3.0", features = ["cargo", "derive"] }
clawless = { path = "crates/clawless", version = "=0.5.0" }
clawless-core = { path = "crates/clawless-core", version = "=0.5.0" }
clawless-derive = { path = "crates/clawless-derive", version = "=0.5.0" }
convert_case = ">=0.1,<1"
libc = "0.2"
darling = ">=0.23,<1"
erased-serde = ">=0.3,<1"
getset = ">=0.1,<1"
indoc = "2.0.0"
inventory = "0.3.0"
predicates = "3"
proc-macro2 = "1.0.86"
quote = "1.0.28"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
syn = { version = "2.0.31", features = ["full"] }
tempfile = "3"
tokio = { version = "1", features = [
  "macros",
  "rt-multi-thread",
  "signal",
  "sync",
] }
tokio-util = ">=0.4,<1"
trybuild = "1.0.86"
trycmd = ">=0.9, <2"
typed-fields = ">=0.6,<1"
