---
name: Docs

"on":
  pull_request:
  push:
    branches:
      - main
  release:
    types: [released]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The setup cleans the tree itself.
          clean: false
          persist-credentials: false

      - name: Set up the tools
        uses: $/.github/actions/setup

      - name: Build the documentation
        working-directory: docs
        run: |
          npm ci
          npm run build

      - name: Upload the documentation artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docs
          path: docs/build
          if-no-files-found: error

  deploy:
    name: Deploy
    runs-on: ubuntu-latest

    needs: build

    # The documentation describes the crates on crates.io, so the site changes
    # only when a release publishes them.
    if: github.event_name == 'release' && github.event.action == 'released'

    permissions:
      contents: read

    steps:
      # The checkout supplies `wrangler.jsonc`. The site comes from the build
      # job, so no dependency of the build runs in the job that holds the
      # Cloudflare token.
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the documentation artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: docs
          path: docs/build

      # Wrangler uploads the static assets that `wrangler.jsonc` selects. The
      # account of the Worker comes from a secret rather than from the committed
      # configuration, because this repository is public.
      - name: Deploy
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
